<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bellhaven CRM Review</title>
<style>
  :root { --ink:#26282c; --muted:#77798a; --accent:#b3591e; --line:#e5e2da; --bg:#faf9f6; --ok:#1e6e46; --bad:#a52441; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 -apple-system,"Segoe UI",Roboto,sans-serif; }
  header { background:#26282c; color:#f6f0e7; padding:13px 26px; display:flex; align-items:baseline; gap:14px; }
  header a { color:#f6f0e7; text-decoration:none; font-weight:700; }
  header .sub { font-size:13px; color:#c9bfa8; }
  .wrap { max-width:1060px; margin:0 auto; padding:28px 22px 80px; }
  h1 { font-size:22px; margin:0 0 4px; }
  h2 { font-size:16px; color:var(--accent); margin:30px 0 10px; text-transform:uppercase; letter-spacing:.05em; }
  .cards { display:flex; gap:14px; margin:18px 0; flex-wrap:wrap; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px 22px; min-width:130px; }
  .card .n { font-size:26px; font-weight:800; }
  .card .l { font-size:12.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .btn { display:inline-block; padding:9px 18px; background:var(--accent); color:#fff; border:0; border-radius:6px; font-size:14px; font-weight:600; cursor:pointer; text-decoration:none; }
  .btn:hover { filter:brightness(.92); }
  .btn.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
  .btn.ok { background:var(--ok); }
  .btn.bad { background:var(--bad); }
  table { border-collapse:collapse; width:100%; background:#fff; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  th, td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:top; }
  th { background:#f1eee7; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  tr:last-child td { border-bottom:0; }
  .pill { display:inline-block; font-size:11.5px; font-weight:700; border-radius:999px; padding:2px 10px; }
  .pill.pending { background:#fdf6d8; color:#7a5d00; }
  .pill.approved { background:#e7efe9; color:var(--ok); }
  .pill.rejected { background:#f9e5ea; color:var(--bad); }
  pre { background:#26282c; color:#e8e4da; padding:13px 15px; border-radius:6px; overflow-x:auto; font-size:12.5px; line-height:1.5; }
  .ev { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:12px 0; }
  .ev .box { background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px 16px; }
  .ev .box h3 { margin:0 0 8px; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .kv { display:grid; grid-template-columns:130px 1fr; gap:2px 10px; font-size:13.5px; }
  .kv .k { color:var(--muted); }
  .rationale { background:#fff; border-left:3px solid var(--accent); border-radius:0 6px 6px 0; padding:10px 14px; margin:12px 0; font-size:14px; }
  .actions { display:flex; gap:10px; margin-top:14px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<header>
  <a href="/">Bellhaven CRM Review</a>
  <span class="sub">proposals &rarr; human approval &rarr; CRM writes</span>
  <span class="sub" style="margin-left:auto"><a href="/results" style="font-weight:400;color:#c9bfa8">results</a> &middot; <a href="/endstate" style="font-weight:400;color:#c9bfa8">end-state report</a></span>
</header>
<div class="wrap">
{% block content %}{% endblock %}
</div>
</body>
</html>
